services:
  mysql:
    image: mysql:8
    container_name: mysql
    command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --gtid-mode=ON --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./sql:/var/sql
      - mysql-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306/tcp"
      -
  maxwell:
    image: zendesk/maxwell:v1.46.0
    container_name: maxwell
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./maxwell/config.properties:/app/config.properties:ro
      - ./maxwell/filter.js:/app/filter.js
      - ./build/libs/maxwell-plugins-1.0-SNAPSHOT.jar:/app/lib/maxwell-plugins-1.0-SNAPSHOT.jar:ro
      # Mount client certs from project root's certs directory
      #- ./certs/kafka.client.keystore.jks:/etc/maxwell/secrets/kafka.client.keystore.jks:ro
      #- ./certs/kafka.client.truststore.jks:/etc/maxwell/secrets/kafka.client.truststore.jks:ro
    command: /app/bin/maxwell --config /app/config.properties --javascript /app/filter.js

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-9093},INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_BROKER_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT:-9093}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "${KAFKA_BROKER_PORT:-9092}:19092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      SERVER_PORT: 8088
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8088}:8088"

volumes:
  kafka-data:
